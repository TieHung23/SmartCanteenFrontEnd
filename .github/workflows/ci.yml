name: CI

on:
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: smart_canteen_super_secret_key_123456
      NEXTAUTH_URL: http://localhost:3000/
      NEXT_PUBLIC_API_URL: http://178.128.100.1:8080/
      NEXT_PUBLIC_APP_URL: http://localhost:3000/
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: 91493514580-ddeki7akgu4gg92tepa2hoda2c6mvv2nq.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          if-no-files-found: ignore
          retention-days: 3
