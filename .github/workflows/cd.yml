name: CD

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  deploy-via-ssh:
    name: CD Deploy (SSH Ubuntu)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package artifact
        run: |
          tar -czf sc-frontend-release.tar.gz \
            .next/ \
            public/ \
            package.json \
            package-lock.json \
            next.config.ts

      - name: Upload package to Ubuntu
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: sc-frontend-release.tar.gz
          target: /tmp

      - name: Deploy via SSH (simulate supported)
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_FRONTEND }}
          DEPLOY_SIMULATE: ${{ secrets.DEPLOY_SIMULATE }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,DEPLOY_SIMULATE
          script: |
            set -e
            TARGET_PATH="${DEPLOY_PATH:-/opt/smartcanteen/frontend}"
            SIMULATE="${DEPLOY_SIMULATE:-true}"

            mkdir -p "$TARGET_PATH"
            if [ "$SIMULATE" = "true" ]; then
              echo "[SIMULATE] SSH connected to Ubuntu"
              echo "[SIMULATE] Would extract /tmp/sc-frontend-release.tar.gz to $TARGET_PATH"
              echo "[SIMULATE] Would run npm ci --omit=dev in $TARGET_PATH"
              echo "[SIMULATE] Would restart service smartcanteen-frontend"
            else
              tar -xzf /tmp/sc-frontend-release.tar.gz -C "$TARGET_PATH"
              cd "$TARGET_PATH" && npm ci --omit=dev
              sudo systemctl restart smartcanteen-frontend
              sudo systemctl status smartcanteen-frontend --no-pager
            fi
